<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scarline · Incident workspace</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><header><strong class="brand"><i aria-hidden="true">▧</i> Scarline</strong><span class="env">Incident workspace</span><span class="mode">Simulation · <span id="connection">Connecting</span></span><button id="unlock">Workspace access</button></header>
<main><div class="heading"><div><small>OPERATIONS / MEMORY</small><h1>Decision workspace</h1></div><div class="actions"><a class="outline" href="/audit">Audit report</a><a class="outline" href="/api/audit" download>Export JSON</a></div></div>
<section class="metrics" id="metrics" aria-label="Workspace totals"></section>
<nav aria-label="Workspace views"><button data-view="live">Live activity</button><button data-view="feed">Decision feed</button><button data-view="ledger">Scar ledger</button><button data-view="services">Services</button><button data-view="meko">Meko connection</button><button data-view="benchmark">Benchmark</button></nav><section id="extra" hidden></section>
<div class="layout" id="workspace-layout"><section class="panel"><div class="panelhead"><h2 id="title">Decision feed</h2><div class="tools"><button class="quiet" id="incident">New incident</button><button id="create">Run pre-flight</button></div></div><label class="search"><span>⌕</span><input id="search" placeholder="Filter by service or action" aria-label="Filter list"></label><div id="list"></div></section>
<aside class="panel" id="detail" aria-live="polite"></aside></div><p id="notice" role="status"></p></main>
<dialog><form id="form"><div class="panelhead"><h2 id="formtitle"></h2><button type="button" class="quiet" id="close" aria-label="Close">×</button></div><div id="fields"></div><p id="formerror" role="alert"></p><div class="actions"><button type="submit" id="submit">Save</button></div></form></dialog></body></html>
