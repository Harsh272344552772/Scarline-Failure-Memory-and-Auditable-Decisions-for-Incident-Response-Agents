
services:
  - type: web
    name: scarline
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SCARLINE_OPERATOR_TOKEN
        generateValue: true
      - key: MEKO_DATAPACK_ID
        value: 3985023e-ece5-4b81-9833-2132c3b7ce24
      - key: MEKO_API_KEY
        sync: false
